  <g fill="#ffffff">
    <rect x="17" y="21" width="26" height="5" rx="2.5"/>
    <rect x="17" y="30" width="30" height="5" rx="2.5"/>
    <rect x="17" y="39" width="20" height="5" rx="2.5"/>
  </g>
</svg>
