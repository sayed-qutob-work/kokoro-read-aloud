<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Same accent and three-text-lines motif as the Windows tray icon
       (tray_win32.make_icon), drawn as vector so the desktop can scale it. -->
