# The server's dependencies, for uv. Install one variant:
#
#   uv sync --extra cpu     Paradee-8M on the CPU: no torch, no kokoro
#   uv sync --extra cuda    adds Kokoro on an NVIDIA GPU (torch for CUDA 12.6)
#
# The cpu extra is empty: a bare `uv sync` installs the same set. Setup
# always names one. The CPU build reads with Paradee alone, through
# english_g2p, so it needs neither kokoro nor torch (AUDIT 2026-11-01).
#
# uv.lock pins every package, with hashes, to the set measured in
# docs/AUDIT.md. Only the server uses this environment: the settings panel
# and the caption strip run on the system Python (paths.py).
#
# requirements*.txt are this lock exported for pip (Windows), by
# tools/export-requirements.sh. Re-run it after every change to uv.lock.

[project]
name = "kokoro-read-aloud"
version = "0.2.0"
description = "Select text anywhere, press a hotkey, hear it read aloud. Local Kokoro TTS."
license = "MIT"
# kokoro 0.9.4 needs >=3.10,<3.13; every measurement is on 3.12.
requires-python = "==3.12.*"
dependencies = [
    # The G2P, which turns text into the phonemes both models read, pinned
    # to what was measured. Not misaki[en]: that extra adds
    # spacy-curated-transformers, which needs torch, for a transformer
    # model the server never loads (trf=False). The rest of the extra:
    "misaki==0.9.4",
    "num2words==0.5.14",
    "spacy==3.8.16",
    "phonemizer-fork==3.3.2",
    "espeakng-loader==0.2.4",
    # misaki installs this spaCy model with pip on first use, and a uv venv
    # has no pip, so it is a dependency instead. Must match spaCy's 3.8.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # Runs Paradee-8M, the small CPU model (AUDIT 2026-11-01). The PyPI
    # build is CPU-only, on both platforms.
    "onnxruntime==1.31.1",
    "flask==3.1.3",
    "sounddevice==0.5.5",
    "numpy==2.5.1",
    "comtypes==1.4.16; sys_platform == 'win32'",
]

[project.optional-dependencies]
cpu = []
# kokoro asks for misaki[en]>=0.9.4 with no upper bound; it is held at the
# one above. misaki[en] is kokoro's own requirement, so it stays here.
cuda = ["kokoro==0.9.4", "misaki[en]==0.9.4", "torch==2.13.0"]

[tool.uv]
package = false             # an application: nothing to build or install
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
# Indirect dependencies held at the versions in the venv every AUDIT
# number was measured with (built 2026-10-06). Left free, uv picks newer
# ones, including huggingface-hub 2.x; a date cut-off (exclude-newer) was
# worse, dropping transformers back to 4.12.
constraint-dependencies = [
    "csvw==4.1.0",
    "cuda-bindings==12.9.9",
    "filelock==4.0.12",
    "hf-xet==1.6.0",
    "huggingface-hub==1.33.0",
    "pycparser==3.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "smart-open==8.0.2",
    "tokenizers==0.23.2",
    "transformers==5.18.0",
    "typer==0.27.2",
    "wrapt==2.5.0",
]
# The platforms this is tested on. Without this uv also resolves macOS and
# ARM, where the CUDA build does not exist.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# torch comes from PyTorch's own index. PyPI's Linux torch pulls in the
# CUDA 13 libraries, which nothing here was measured with (AUDIT 2026-10-17).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
